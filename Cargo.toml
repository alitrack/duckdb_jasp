[package]
name = "duckdb_jasp"
version = "0.1.0"
edition = "2021"
description = "DuckDB extension: read JASP project files (.jasp) as SQL tables"
license = "MIT"
repository = "https://github.com/alitrack/duckdb_jasp"

[lib]
name = "jasp_ext"
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
quack-rs = "0.14"
libduckdb-sys = "1.10504"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
