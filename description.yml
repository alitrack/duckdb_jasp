extension:
  name: jasp_ext
  description: Read JASP project files (.jasp) as SQL tables — data, column metadata and analysis registry
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;windows_amd64_rtools;windows_amd64_mingw"
  requires_toolchains: "rust"
  maintainers:
    - alitrack

repo:
  github: alitrack/duckdb_jasp
  ref: refs/tags/v0.1.0
